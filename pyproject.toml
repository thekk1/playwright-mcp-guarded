[project]
name = "playwright-mcp-guarded"
version = "0.1.0"
description = "Domain-guarded, per-user isolated wrapper around @playwright/mcp for LibreChat"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.29,<2",
  "starlette>=0.37",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "anyio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
playwright-mcp-guarded = "guardian.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guardian"]
